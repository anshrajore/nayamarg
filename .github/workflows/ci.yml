name: Monorepo CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint, Test & Build Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Monorepo ESLint
        run: pnpm run lint

      - name: Monorepo Automated Tests
        run: pnpm run test:all

      - name: Build Monorepo Packages & Next.js App
        run: pnpm run build
